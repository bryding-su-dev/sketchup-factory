name: CI

# Cost-conscious by design (w44). One cheap job (`checks`) runs on every code PR into sketchup; the slow
# Playwright job (`e2e`) runs only when a PR carries the `e2e` label or someone starts it by hand. This host runs
# on a Mac, so there is no Windows or macOS job: Windows costs 2x and macOS 10x a Linux minute on a private repo.
# The repo is public today (standard runners are free); these cuts keep the bill small if that ever changes.

on:
  # sketchup is this fork's integration branch (SketchUp Factory); main follows upstream.
  # No `push` trigger: a PR's run already tested the code that merges, so a push run would test it again.
  pull_request:
    branches: [main, sketchup]
    types: [opened, synchronize, reopened, labeled]
    # A docs-only change cannot break the code, so it starts no job.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'changelog.d/**'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright suite
        type: boolean
        default: true
      update_snapshots:
        description: Re-render every visual snapshot (Linux) and upload them as the "linux-snapshots" artifact
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Typecheck, unit tests, build, secret scan, identities
    # Adding a label re-triggers this workflow; a label run needs only the e2e job.
    if: github.event.action != 'labeled'
    # A newer push to the same PR cancels the run in flight. Per job, so labelling never cancels the checks.
    concurrency:
      group: ci-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scan and the identity check read history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: A git identity for the tests that commit
        # Global config, not GIT_AUTHOR_* variables: some tests set a commit's identity with -c on purpose.
        run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Commit identities are noreply
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          else
            # A manual run: check everything reachable.
            range="$AFTER"
          fi
          node scripts/check-identity.ts "$range"
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: Secret scan (history of this commit, then the working tree)
        # HEAD only: other branches on the remote are not what is being merged.
        run: |
          $RUNNER_TEMP/gitleaks git . --log-opts=HEAD --redact --no-banner --verbose
          $RUNNER_TEMP/gitleaks dir . --redact --no-banner
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Typecheck (server, shared, scripts, e2e)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npm --prefix web run typecheck
      - name: Unit tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Unit tests'
            grep -E '^ℹ (tests|pass|fail|skipped) ' coverage.txt | sed 's/^ℹ /- /'
            echo
            echo '### Coverage (files the tests load)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the web UI
        run: npm --prefix web run build

  e2e:
    name: Playwright (Chromium + WebKit)
    # Slow and the biggest cost: only for a PR labelled `e2e` (add the label once the PR is ready) or a manual run.
    # Other labels added later do not start it again.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      (github.event_name == 'workflow_dispatch' && inputs.e2e)
    concurrency:
      group: ci-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Build the web UI
        run: npm --prefix web run build
      - name: Snapshot mode
        id: snap
        shell: bash
        run: |
          # With no Linux baselines committed yet (or when asked), render them instead of comparing.
          if [ "${{ inputs.update_snapshots }}" = "true" ] || ! ls e2e/__screenshots__/*/*-linux.png >/dev/null 2>&1; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Rendering visual baselines instead of comparing them; commit the linux-snapshots artifact into e2e/__screenshots__/."
          fi
      - name: Run Playwright
        run: npx playwright test ${{ steps.snap.outputs.update == 'true' && '--update-snapshots=all' || '' }}
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload rendered snapshots
        if: always() && steps.snap.outputs.update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-snapshots
          path: e2e/__screenshots__/
          retention-days: 7
